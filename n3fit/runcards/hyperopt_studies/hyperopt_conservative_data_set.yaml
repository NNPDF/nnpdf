added_filter_rules:
- dataset: CMS_Z0J_8TEV_PT-Y
  reason: Avoid the region where resummation effects become important.
  rule: pT >= 30
- dataset: ATLAS_Z0J_8TEV_PT-Y
  reason: Avoid the region where resummation effects become important.
  rule: pT >= 30
- dataset: ATLAS_1JET_7TEV_PTY-R06
  reason: Power correction exceeds the experimental uncertainty at low pT
  rule: not((y<0.5 and pT<=277) or (0.5<y<1.0 and pT<=252) or (1.0<y<1.5 and pT<=162))
- dataset: ATLAS_1JET_8TEV_R06_PTY
  reason: Power correction exceeds the experimental uncertainty at low pT
  rule: not((y<0.5 and pT<=304) or (0.5<y<1.0 and pT<=277) or (1.0<y<1.5 and pT<=277) or (1.5<y<2.0 and pT<=228) or (2.0<y<2.5 and pT<=183) or (y>2.5 and pT<=108))
- dataset: CMS_1JET_7TEV_R07-PTY
  reason: Power correction exceeds the experimental uncertainty at low pT
  rule: not((y<0.5 and pT<=286) or (0.5<y<1.0 and pT<=286) or (1.0<y<1.5 and pT<=258.5) or (1.5<y<2.0 and pT<=185))
- dataset: CMS_1JET_8TEV_PTY
  reason: Power correction exceeds the experimental uncertainty at low pT
  rule: not((y<0.5 and pT<=412.5) or (0.5<y<1.0 and pT<=412.5) or (1.0<y<1.5 and pT<=412.5) or (1.5<y<2.0 and pT<=315) or (2.0<y<2.5 and pT<=258.5) or (y>2.5 and pT<=143))
- dataset: CMS_1JET_13TEV_DIF_PT-Y-R07
  reason: Power correction exceeds the experimental uncertainty at low pT
  rule: not((y<0.5 and pT<=362.5) or (0.5<y<1.0 and pT<=362.5) or (1.0<y<1.5 and pT<=362.5) or (1.5<y<2.0 and pT<=301))

##### Hyperparameter scan configuration
hyperscan_config:
  stopping:
      min_epochs: 15e3
      max_epochs: 45e3
      min_patience: 0.1
      max_patience: 0.4
  positivity:
      min_initial: 10
      max_initial: 1000
  optimizer:
  - optimizer_name: 'Adadelta'
    learning_rate:
      sampling: log
      min: 1e-1
      max: 10
    clipnorm:
      sampling: log
      min: 1e-3
      max: 1e0
  - optimizer_name: 'Amsgrad'
    learning_rate:
      sampling: log
      min: 1e-4
      max: 1e-2
    clipnorm:
      sampling: log
      min: 1e-7
      max: 1e-4
  - optimizer_name: 'Nadam'
    learning_rate:
      sampling: log
      min: 1e-4
      max: 1e-2
    clipnorm:
      sampling: log
      min: 1e-7
      max: 1e-4
  - optimizer_name: 'Adam'
    learning_rate:
      sampling: log
      min: 1e-4
      max: 1e-2
    clipnorm:
      sampling: log
      min: 1e-7
      max: 1e-4
  architecture:
      initializers: ['glorot_normal', 'glorot_uniform']
      n_layers: [3,4,5]
      min_units: 10
      max_units: 65
      activations: ['tanh', 'sigmoid']

