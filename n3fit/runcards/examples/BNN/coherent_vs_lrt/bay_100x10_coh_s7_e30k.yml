################################################################################
# NNLO QCD TRN evolution
theory:
  theoryid: 40_000_000

################################################################################
trvlseed: 591866982
nnseed: 945709987
mcseed: 519562661
genrep: false
diagonal_basis: false

################################################################################
parameters: # This defines the parameter dictionary that is passed to the Model Trainer
  nodes_per_layer: [25, 20, 8]
  activation_per_layer: [tanh, tanh, linear]
  initializer: glorot_normal
  optimizer:
    clipnorm: 6.073e-6
    learning_rate: 2.621e-3
    optimizer_name: Nadam
  epochs: 30000
  positivity:
    initial: 400000.0   # NNPDF4.0: 184.8; stronger ramp so positivity competes with the KL term
    multiplier:
  integrability:
    initial: 10
    multiplier:
  stopping_patience: 0.1
  layer_type: ['dense', 'dense', 'VBDense']
  dropout: 0.0
  threshold_chi2: 3.5
  bayesian:
    n_bnn_models: 120           # trained BNN models, one per n3fit task (n3fit runcard.yml <model>)
    n_bnn_samples: 3            # posterior samples written per model (replicas model*N .. model*N + N-1)
    sampling_space: weight      # weight | function (linearized Laplace)
    prior_prec: 1.0             # precision of the Gaussian prior on the Bayesian weights
    std_init: -7.0              # initial log-variance of the Bayesian weights
    bayesian_bias: [false, false, true]   # per layer: Bayesian bias (default: true on VBDense layers)
    bayesian_preproc: false     # true: preprocessing exponents drawn per sample
    bayes_dropout: 0.0
    train_sampling: coherent    # coherent: one weight draw per training step, shared by all x points
                                #   and all calls of the layer | lrt (see below)
    kl_annealing: linear        # KL warm-up: linear (0 -> 1) | cosine (0.1 -> 1)
    kl_warmup_epochs: 3000      # warm-up length (default 3000, at most epochs // 4); no best epoch before its end
    per_replica:                # per-sample quantities instead of copies of the trained model's
      chi2: true                # chi2, erf_tr, erf_vl of each sample
      positivity: true          # pos_state of each sample (n3fit's stopping positivity check)
      postfit_veto: true        # postfit: per-sample positivity veto, and filling up to the requested
                                #   number with replicas of chi2 <= 2x the passing mean
      posterior_stopping_samples: 0   # > 0: stopping also needs positivity at the posterior mean and
                                      #   at this many fixed draws
      rejection_sampling: false       # keep only posterior draws passing positivity
      rejection_max_draws: null       # default 50 * n_bnn_samples
    #
    # Other posteriors -- set explicitly:
    # LRT training (as before 1ee4b2551; trains from the prior width):
    #   train_sampling: lrt
    #   std_init: 0.0               # = -log(prior_prec)
    #   kl_annealing: cosine
    #   kl_warmup_epochs: <epochs // 4>   # the old repeating cosine warm-up no longer exists
    #   (not available with bayesian_flow)
    # Normalizing flow on the Bayesian layer:
    #   bayesian_flow: [false, false, true]   # per layer, like bayesian_bias
    #   flow_n_couplings: 3
    #   flow_hidden_units: 24
    #   train_sampling: coherent    # lrt is not implemented for flows
    #   std_init: -7.0
    # Correlated low-rank posterior N(mu, D + U U^T):
    #   layer_type: ['dense', 'dense', 'VBDense_correlated']   (under parameters)
    #   rank: 4
    #   u_init: 1e-4
    #   train_sampling: coherent
    #   std_init: -7.0
fitting:
  fitbasis: EVOL
  savepseudodata: True
  basis:
  - {fl: sng, trainable: false, smallx: [1.089, 1.119], largex: [1.475, 3.119]}
  - {fl: g, trainable: false, smallx: [0.7504, 1.098], largex: [2.814, 5.669]}
  - {fl: v, trainable: false, smallx: [0.479, 0.7384], largex: [1.549, 3.532]}
  - {fl: v3, trainable: false, smallx: [0.1073, 0.4397], largex: [1.733, 3.458]}
  - {fl: v8, trainable: false, smallx: [0.5507, 0.7837], largex: [1.516, 3.356]}
  - {fl: t3, trainable: false, smallx: [-0.4506, 0.9305], largex: [1.745, 3.424]}
  - {fl: t8, trainable: false, smallx: [0.5877, 0.8687], largex: [1.522, 3.515]}
  - {fl: t15, trainable: false, smallx: [1.089, 1.141], largex: [1.492, 3.222]}

