#
# Configuration file for n3fit
#
############################################################
description: Basic runcard with extra options such as debugging and tensorboard

############################################################
# frac: training fraction
# ewk: apply ewk k-factors
# sys: systematics treatment (see systypes)
dataset_inputs:
- {dataset: NMC_NC_NOTFIXED_EM-F2, variant: legacy_dw}
- {dataset: SLAC_NC_NOTFIXED_D_EM-F2, variant: legacy_dw}
- {dataset: ATLAS_Z0J_8TEV_PT-M }

diagonal_frac: 0.75
parallel_models: false


############################################################
datacuts:
  t0pdfset     : NNPDF40_nnlo_as_01180 # PDF set to generate t0 covmat
  q2min        : 3.49                # Q2 minimum
  w2min        : 12.5                # W2 minimum

############################################################
theory:
  theoryid: 41_000_000       # database id

parameters: # This defines the parameter dictionary that is passed to the Model Trainer
  nodes_per_layer: [15, 10, 8]
  activation_per_layer: ['sigmoid', 'sigmoid', 'linear']
  initializer: 'glorot_normal'
  optimizer:
    optimizer_name: 'RMSprop'
    learning_rate: 0.01
    clipnorm: 1.0
  epochs: 900
  positivity:
    multiplier: 1.05 # When any of the multiplier and/or the initial is not set
    initial: # the maxlambda will be used instead to compute these values per dataset
    threshold: 1e-5
  stopping_patience: 0.30 # percentage of the number of epochs
  layer_type: ['dense','dense','VBDense']
  dropout: 0.0
  threshold_chi2: 5.0
  bayesian:
    n_bnn_models: 1             # trained BNN models, one per n3fit task (n3fit runcard.yml <model>)
    n_bnn_samples: 50           # posterior samples written per model (replicas model*N .. model*N + N-1)
    sampling_space: weight      # weight | function (linearized Laplace)
    prior_prec: 1.0             # precision of the Gaussian prior on the Bayesian weights
    std_init: -7.0              # not set originally (code default then: -log(prior_prec)); initial log-variance of the Bayesian weights
    bayesian_bias: [false, false, true]   # per layer: Bayesian bias (default: true on VBDense layers)
    bayesian_preproc: false     # fitting::bayesian_preproc: true originally, a key that was never read (ran without); true: preprocessing exponents drawn per sample
    bayes_dropout: 0.0
    train_sampling: coherent    # not set originally (flow layers were always trained on weight samples); coherent: one weight draw per training step, shared by all x points
                                #   and all calls of the layer | lrt (see below)
    kl_annealing: linear        # not set originally (the code default of that time); KL warm-up: linear (0 -> 1) | cosine (0.1 -> 1)
    kl_warmup_epochs: 3000      # not set originally (the code default of that time); warm-up length (default 3000, at most epochs // 4); no best epoch before its end
    per_replica:                # per-sample quantities instead of copies of the trained model's
      chi2: true                # not set originally (code default then: false); chi2, erf_tr, erf_vl of each sample
      positivity: true          # not set originally (code default then: false); pos_state of each sample (n3fit's stopping positivity check)
      postfit_veto: true        # not set originally (code default then: false); postfit: per-sample positivity veto, and filling up to the requested
                                #   number with replicas of chi2 <= 2x the passing mean
      posterior_stopping_samples: 0   # > 0: stopping also needs positivity at the posterior mean and
                                      #   at this many fixed draws
      rejection_sampling: false       # keep only posterior draws passing positivity
      rejection_max_draws: null       # default 50 * n_bnn_samples
    # this runcard's posterior:
    bayesian_flow: [false, false, true]         # NF-enriched posterior on the (last) VBDense layer
    flow_n_couplings: 8
    flow_hidden_units: 64
    #
    # Other posteriors -- set explicitly:
    # LRT training (as before 1ee4b2551; trains from the prior width):
    #   train_sampling: lrt
    #   std_init: 0.0               # = -log(prior_prec)
    #   kl_annealing: cosine
    #   kl_warmup_epochs: <epochs // 4>   # the old repeating cosine warm-up no longer exists
    #   (not available with bayesian_flow)
    # Normalizing flow on the Bayesian layer:
    #   bayesian_flow: [false, false, true]   # per layer, like bayesian_bias
    #   flow_n_couplings: 3
    #   flow_hidden_units: 24
    #   train_sampling: coherent    # lrt is not implemented for flows
    #   std_init: -7.0
    # Correlated low-rank posterior N(mu, D + U U^T):
    #   layer_type: ['dense', 'dense', 'VBDense_correlated']   (under parameters)
    #   rank: 4
    #   u_init: 1e-4
    #   train_sampling: coherent
    #   std_init: -7.0

############################################################
trvlseed: 1
nnseed: 2
mcseed: 3
genrep: false     # true = generate MC replicas, false = use real data

fitting:
  # NN23(QED) = sng=0,g=1,v=2,t3=3,ds=4,sp=5,sm=6,(pht=7)
  # EVOL(QED) = sng=0,g=1,v=2,v3=3,v8=4,t3=5,t8=6,(pht=7)
  # EVOLS(QED)= sng=0,g=1,v=2,v8=4,t3=4,t8=5,ds=6,(pht=7)
  # FLVR(QED) = g=0, u=1, ubar=2, d=3, dbar=4, s=5, sbar=6, (pht=7)
  fitbasis: NN31IC # EVOL (7), EVOLQED (8), etc.
  basis:
      # remeber to change the name of PDF accordingly with fitbasis
      - { fl: sng,  smallx: [1.05,1.19], largex: [1.47,2.70], trainable: False }
      - { fl: g,    smallx: [0.94,1.25], largex: [0.11,5.87], trainable: False }
      - { fl: v,    smallx: [0.54,0.75], largex: [1.15,2.76], trainable: False }
      - { fl: v3,   smallx: [0.21,0.57], largex: [1.35,3.08] }
      - { fl: v8,   smallx: [0.52,0.76], largex: [0.77,3.56], trainable: True }
      - { fl: t3,   smallx: [-0.37,1.52], largex: [1.74,3.39] }
      - { fl: t8,   smallx: [0.56,1.29], largex: [1.45,3.03] }
      - { fl: cp,   smallx: [0.12,1.19], largex: [1.83,6.70] }

############################################################
positivity:
  posdatasets:
  - {dataset: NNPDF_POS_2P24GEV_F2U, maxlambda: 1e6}        # Positivity Lagrange Multiplier
  - {dataset: NNPDF_POS_2P24GEV_FLL, maxlambda: 1e6}
  - {dataset: NNPDF_POS_2P24GEV_XGL, maxlambda: 1e6}

############################################################
integrability:
  integdatasets:
  - {dataset: NNPDF_INTEG_3GEV_XT3, maxlambda: 1e2}

# Apply a cut to a dataset or process type, in this case to the positivity dataset `NNPDF_POS_2P24GEV_XGL` which has process type: POS_XPDF
added_filter_rules:
    - process_type: POS_XPDF
      rule: "x > 0.1"

############################################################
debug: True
maxcores: 8
save: 'weights.h5'
# load: '/path/to/weights.h5/file'
